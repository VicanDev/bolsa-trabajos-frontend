<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="col-md-5">
        <div class="card p-4 shadow border-0 rounded-4" style="background-color: #f8f9fa;">
            <div class="text-center mb-4">
                <h2 class="fw-bold text-success">Registro</h2>
                <p class="text-muted">Crea tu cuenta en ChambaYa</p>
            </div>
            
            <form>
                <div class="mb-3">
                    <label class="form-label fw-bold">Nombre Completo</label>
                    <input type="text" name="nombre" [(ngModel)]="nombre" class="form-control" placeholder="Ej. Juan Pérez" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Correo Electrónico</label>
                    <input type="email" name="correo" [(ngModel)]="correo" class="form-control" placeholder="ejemplo@trabajos.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Contraseña</label>
                    <input type="password" name="password" [(ngModel)]="password" class="form-control" placeholder="******" required>
                </div>
                
                <div *ngIf="mensaje" class="alert alert-info mt-2 text-center fw-bold">
                    {{ mensaje }}
                </div>

                <button type="button" (click)="registrar()" class="btn btn-success w-100 py-2 fw-bold">Crear Cuenta</button>
            </form>
            
            <div class="text-center mt-3">
                <small class="text-muted">¿Ya tienes cuenta? <a href="/login" class="text-decoration-none text-success">Inicia sesión</a></small>
            </div>
        </div>
    </div>
</div>
