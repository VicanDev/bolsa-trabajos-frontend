<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="col-md-5">
        <div class="card p-4 shadow border-0 rounded-4" style="background-color: #f8f9fa;">
            <div class="text-center mb-4">
                <h2 class="fw-bold text-primary">ChambaYa</h2>
                <p class="text-muted">Portal de Trabajos Temporales</p>
            </div>
            
            <form>
                <div class="mb-3">
                    <label class="form-label fw-bold">Correo Electrónico</label>
                    <input type="email" name="correo" [(ngModel)]="correo" class="form-control" placeholder="ejemplo@trabajos.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Contraseña</label>
                    <input type="password" name="clave" [(ngModel)]="clave" class="form-control" placeholder="******" required>
                </div>
                
                <!-- Alerta dinámica que aparecerá al hacer clic -->
                <div *ngIf="mensaje" class="alert alert-info mt-2 text-center fw-bold">
                    {{ mensaje }}
                </div>

                <button type="button" (click)="iniciarSesion()" class="btn btn-primary w-100 py-2 fw-bold">Iniciar Sesión</button>
            </form>
            
            <div class="text-center mt-3">
                <small class="text-muted">¿No tienes cuenta? <a href="/registro" class="text-decoration-none">Regístrate aquí</a></small>
            </div>
        </div>
    </div>
</div>
