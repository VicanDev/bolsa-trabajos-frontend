<nav class="app-navbar">
    <div class="app-navbar-inner">
        <a class="app-logo"><span class="app-logo-mark">💼</span> ChambaYa</a>
    </div>
</nav>

<div class="page-container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <button class="btn btn-outline-secondary mb-3" (click)="volver()">⬅ Volver al Dashboard</button>

            <div class="card p-4 fade-in-up">
                <div class="card-body">
                    <p class="page-eyebrow">Nueva publicación</p>
                    <h3 class="mb-4">Publicar Nueva Oferta</h3>

                    <form>
                        <div class="mb-3">
                            <label class="form-label">Título del puesto *</label>
                            <input type="text" class="form-control" [(ngModel)]="titulo" name="titulo" placeholder="Ej: Desarrollador Frontend" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea class="form-control" [(ngModel)]="descripcion" name="descripcion" rows="4" placeholder="Describe las responsabilidades del puesto..."></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Ubicación</label>
                                <input type="text" class="form-control" [(ngModel)]="ubicacion" name="ubicacion" placeholder="Ej: Lima, Remoto">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Duración</label>
                                <input type="text" class="form-control" [(ngModel)]="duracion" name="duracion" placeholder="Ej: 3 meses">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Requisitos</label>
                            <textarea class="form-control" [(ngModel)]="requisitos" name="requisitos" rows="3" placeholder="Lista los requisitos del puesto..."></textarea>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Categoría</label>
                            <select class="form-select" [(ngModel)]="idCategoria" name="idCategoria">
                                <option *ngFor="let cat of categorias" [ngValue]="cat.id">{{ cat.nombre }}</option>
                            </select>
                        </div>

                        <div *ngIf="mensaje" class="alert alert-success text-center">{{ mensaje }}</div>

                        <button type="button" class="btn btn-primary w-100 btn-lg btn-block-loading" [disabled]="guardando" (click)="guardarOferta()">
                            <span *ngIf="guardando" class="spinner-border spinner-border-sm"></span>
                            {{ guardando ? 'Publicando...' : 'Publicar Oferta' }}
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
