<div class="toast-stack">
    <div
        *ngFor="let toast of notifications.toasts()"
        class="toast align-items-center text-white border-0 show mb-2 shadow"
        [ngClass]="{
            'bg-success': toast.type === 'success',
            'bg-danger': toast.type === 'danger',
            'bg-info': toast.type === 'info',
            'bg-warning text-dark': toast.type === 'warning'
        }"
        role="alert"
    >
        <div class="d-flex">
            <div class="toast-body">{{ toast.message }}</div>
            <button
                type="button"
                class="btn-close me-2 m-auto"
                [class.btn-close-white]="toast.type !== 'warning'"
                (click)="notifications.dismiss(toast.id)"
            ></button>
        </div>
    </div>
</div>
